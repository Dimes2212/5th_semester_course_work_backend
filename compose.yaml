services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuslost}
      POSTGRES_USER: ${POSTGRES_USER:-campuslost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslost}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuslost} -d ${POSTGRES_DB:-campuslost}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]

volumes:
  postgres_data:
